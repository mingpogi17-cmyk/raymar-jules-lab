<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ray Mar Apps — Business Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>Ray Mar Apps</h1>
      <p class="subtitle">Business Expense Tracker (MVP)</p>
    </div>
  </header>

  <main class="container">
    <!-- Storage Error/Warning Alert Container -->
    <div id="storageAlert" class="alert alert-danger" style="display: none;" role="alert"></div>

    <!-- Dashboard / Summary Section -->
    <section class="card dashboard-card">
      <h2>Dashboard Summary</h2>
      <div class="total-container">
        <span class="total-label">Total Expenses:</span>
        <span class="total-amount" id="totalExpenses">₱0.00</span>
      </div>
      <div class="category-summary">
        <h3>Summary by Category</h3>
        <div id="categoryTotals" class="category-totals-grid">
          <!-- Populated by app.js -->
        </div>
      </div>
    </section>

    <!-- Add Expense Form -->
    <section class="card form-card">
      <h2>Add New Expense</h2>
      <form id="expenseForm" novalidate>
        <div class="form-group">
          <label for="expenseDate">Date <span class="required">*</span></label>
          <input type="date" id="expenseDate" required class="form-control">
          <small class="error-msg" id="dateError"></small>
        </div>

        <div class="form-group">
          <label for="expenseAmount">Amount (₱) <span class="required">*</span></label>
          <input type="number" id="expenseAmount" step="0.01" min="0.01" placeholder="0.00" required class="form-control">
          <small class="error-msg" id="amountError"></small>
        </div>

        <div class="form-group">
          <label for="expenseCategory">Category <span class="required">*</span></label>
          <select id="expenseCategory" required class="form-control">
            <option value="">-- Select Category --</option>
            <option value="Utilities">Utilities</option>
            <option value="Supplies">Supplies</option>
            <option value="Rent">Rent</option>
            <option value="Payroll">Payroll</option>
            <option value="Marketing">Marketing</option>
            <option value="Others">Others</option>
          </select>
          <small class="error-msg" id="categoryError"></small>
        </div>

        <div class="form-group">
          <label for="expenseMerchant">Merchant / Payee <span class="required">*</span></label>
          <input type="text" id="expenseMerchant" placeholder="e.g. Meralco, Office Warehouse" required minlength="2" class="form-control">
          <small class="error-msg" id="merchantError"></small>
        </div>

        <div class="form-group">
          <label for="expenseDescription">Description / Notes (Optional)</label>
          <input type="text" id="expenseDescription" placeholder="Additional details..." class="form-control">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Add Expense</button>
      </form>
    </section>

    <!-- Expense List & Filter Section -->
    <section class="card list-card">
      <div class="list-header">
        <h2>Expense History</h2>
        <span class="count-badge" id="expenseCount">0 records</span>
      </div>

      <!-- Filters -->
      <div class="filter-controls">
        <div class="filter-group">
          <input type="text" id="searchInput" placeholder="Search merchant or notes..." class="form-control">
        </div>
        <div class="filter-group">
          <select id="filterCategory" class="form-control">
            <option value="ALL">All Categories</option>
            <option value="Utilities">Utilities</option>
            <option value="Supplies">Supplies</option>
            <option value="Rent">Rent</option>
            <option value="Payroll">Payroll</option>
            <option value="Marketing">Marketing</option>
            <option value="Others">Others</option>
          </select>
        </div>
      </div>

      <!-- Expense List -->
      <div id="expenseListContainer">
        <div class="empty-state" id="emptyState">No expenses recorded yet.</div>
        <ul id="expenseList" class="expense-list"></ul>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p><small>Note: Data is saved locally in your browser (localStorage).</small></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
